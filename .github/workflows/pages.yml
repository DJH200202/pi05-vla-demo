name: Deploy interview demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # The owner explicitly wants privacy first. A private repository never deploys.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Package the static demo
        run: |
          mkdir _site
          cp index.html methods.html style.css app.js overview.mp4 preview.jpg media-manifest.json README.md METHODS.md _site/
          cp -R assets media results _site/
          touch _site/.nojekyll
          sed -i 's/PRIVATE INTERVIEW DEMO/INTERVIEW DEMO/g' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
